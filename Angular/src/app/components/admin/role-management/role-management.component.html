<app-navbar title="User Roles" [showBackButton]="true" [showNewButton]="true" newButtonText="Add Role"
    (backClick)="navigateToDashboard()" (newClick)="openAddDialog()">
</app-navbar>

<div class="role-management-container">

    <div class="content">
        <div *ngIf="isLoading" class="loading-container">
            <mat-spinner></mat-spinner>
        </div>

        <div *ngIf="!isLoading && roles.length === 0" class="empty-state">
            <mat-icon>folder_open</mat-icon>
            <h3>No roles found</h3>
            <p>Click "Add Role" to create your first role</p>
        </div>

        <div *ngIf="!isLoading && roles.length > 0" class="table-container">
            <table mat-table [dataSource]="roles" class="roles-table">

                <!-- Name Column -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Role Name</th>
                    <td mat-cell *matCellDef="let role">
                        <div class="role-name">
                            <mat-icon class="role-icon">badge</mat-icon>
                            {{ role.name }}
                        </div>
                    </td>
                </ng-container>

                <!-- Description Column -->
                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef>Description</th>
                    <td mat-cell *matCellDef="let role">{{ role.description }}</td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>Actions</th>
                    <td mat-cell *matCellDef="let role">
                        <div class="action-buttons">
                            <button mat-icon-button color="primary" (click)="openEditDialog(role)"
                                matTooltip="Edit role">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button mat-icon-button color="warn" (click)="deleteRole(role)" matTooltip="Delete role">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row"></tr>
            </table>
        </div>
    </div>
</div>
